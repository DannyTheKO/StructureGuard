# =============================================================================
# StructureGuard Configuration — 1.21+ BoundingBox Mode
# =============================================================================
debug: false
log-auto-protect: true
process-existing-chunks: true

# World filtering — pick ONE mode:
# 1) Blacklist (default): protect everywhere except listed worlds
disabled-worlds:
  # - resource_world
  # - creative_world

# 2) Whitelist: if non-empty, ONLY these worlds are protected (blacklist still applies)
enabled-worlds:
  # - world
  # - world_nether
  # - world_the_end

default-padding: 10

default-flags:
    block-break: allow
    block-place: allow
    use: allow
    interact: allow
    damage-animals: allow
    pvp: deny
    sleep: deny
    respawn-anchors: deny
    tnt: allow
    chest-access: allow
    vehicle-place: allow
    vehicle-destroy: allow
    lighter: allow
    ride: allow
    potion-splash: allow
    item-frame-rotation: allow
    block-trampling: allow
    firework-damage: allow
    use-anvil: deny
    use-dripleaf: allow
    wind-charge-burst: allow
    breeze-charge-explosion: deny
    pistons: deny
    fire-spread: deny
    lava-fire: deny
    ice-melt: deny
    ice-form: deny
    frosted-ice-melt: deny
    frosted-ice-form: deny
    rr-block-regen: ~.*:10
    rr-temp-build: allow

# Protection Rules — region = BoundingBox expanded by `padding` blocks on all sides
# Y bounds are taken from structure BB (minY/maxY) ± padding, clamped to world height
# Format:
#   "namespace:structure":
#     enabled: true
#     padding: 5
#     priority: 10
#     flags:
#       pvp: deny
#
# Wildcards: "*", "minecraft:*", "minecraft:village*", "cobblemon:*_gym"

protected-structures:
    '*':
        enabled: true
        padding: 10
        priority: 10
        flags:
            block-break: allow
            block-place: allow
            use: allow
            interact: allow
            damage-animals: allow
            pvp: deny
            sleep: deny
            respawn-anchors: deny
            tnt: allow
            chest-access: allow
            vehicle-place: allow
            vehicle-detroy: allow
            ligher: allow
            ride: allow
            potion-splash: allow
            item-frame-rotation: allow
            block-trampling: allow
            firework-damage: allow
            use-anvil: deny
            use-dripleaf: allow
            wind-charge-burst: allow
            breeze-charge-explosion: deny
            pistons: deny
            fire-spread: deny
            lava-fire: deny
            ice-melt: deny
            ice-form: deny
            frosted-ice-melt: deny
            frosted-ice-form: deny
            rr-block-regen: ~.*:10
            rr-temp-build: allow

    'minecraft:mansion':
        enabled: true
        padding: 50
        priority: 11
        flags:
            block-break: allow
            block-place: allow
            use: allow
            interact: allow
            damage-animals: allow
            pvp: deny
            sleep: deny
            respawn-anchors: deny
            tnt: allow
            chest-access: allow
            vehicle-place: allow
            vehicle-detroy: allow
            ligher: allow
            ride: allow
            potion-splash: allow
            item-frame-rotation: allow
            block-trampling: allow
            firework-damage: allow
            use-anvil: deny
            use-dripleaf: allow
            wind-charge-burst: allow
            breeze-charge-explosion: deny
            pistons: deny
            fire-spread: deny
            lava-fire: deny
            ice-melt: deny
            ice-form: deny
            frosted-ice-melt: deny
            frosted-ice-form: deny
            rr-block-regen: ~.*:10
            rr-temp-build: allow
