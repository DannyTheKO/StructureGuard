# =============================================================================
# StructureGuard Configuration — 1.21+ BoundingBox Mode
# =============================================================================
debug: false
process-existing-chunks: true
disabled-worlds:
  # - resource_world

default-padding: 10

default-flags:
  use: allow
  interact: allow
  creeper-explosion: deny
  tnt: deny
  deny-message: "&cThis structure is protected!"

# Protection Rules — region = BoundingBox expanded by `padding` blocks on all sides
# Y bounds are taken from structure BB (minY/maxY) ± padding, clamped to world height
# Format:
#   "namespace:structure":
#     enabled: true
#     padding: 5
#     priority: 10
#     flags:
#       pvp: deny
#
# Wildcards: "*", "minecraft:*", "minecraft:village*", "cobblemon:*_gym"

protected-structures:
  # Add rules with /sg protect <pattern> [padding]

# Permissions:
# structureguard.admin, structureguard.find, structureguard.listall, structureguard.teleport
